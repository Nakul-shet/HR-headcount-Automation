name: Validate Headcount upload

on:
  push:
    paths:
      - 'DataFiles/EligibilityData/**'  # run only when something changes here

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # fetch full history for accurate diff

      - name: Identify changed files
        id: files
        run: |
          echo "🔍 Finding changed files in this push..."
          # Detect files changed (added/modified/renamed) in this push
          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD -- 'DataFiles/EligibilityData/**' || true)

          # Fallback for first commits or GitHub UI uploads
          if [ -z "$CHANGED_FILES" ]; then
            CHANGED_FILES=$(git ls-tree -r --name-only HEAD 'DataFiles/EligibilityData/' || true)
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"
          echo "changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT

      - name: Validate uploaded files
        run: |
          echo "🔍 Validating uploaded files..."
          invalid_files=0

          # Loop through the detected changed files
          for file in ${{ steps.files.outputs.changed_files }}; do
            echo "Found: $file"
          
            # Allow only these two exact files
            if [[ "$file" != "DataFiles/EligibilityData/Ops_Eligibility.xls" && "$file" != "DataFiles/EligibilityData/Practice_Eligibility.xls" ]]; then
              echo "❌ Invalid file name or path: $file"
              invalid_files=1
            else
              echo "✅ Valid file: $file"
            fi
          done

          if [ $invalid_files -ne 0 ]; then
            echo "❌ Validation failed — only Ops_Eligibility.xls and Practice_Eligibility.xls are allowed."
            exit 1
          else
            echo "✅ Validation passed — all uploaded files are valid."
          fi
