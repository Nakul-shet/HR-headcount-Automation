name: Manual SpotAward Trigger

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        default: "Test-Internal"
        type: choice
        options:
          - Test-HR
          - Test-Internal

jobs:
  run-java:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Update MasterConfig.java with environment
        run: |
          sed -i 's|public static final String activeEnvironment = ".*";|public static final String activeEnvironment = "${{ github.event.inputs.environment }}";|' src/main/java/Utilities/Configuration/MasterConfig.java
          echo "✅ Updated environment to ${{ github.event.inputs.environment }}"
          grep "activeEnvironment" src/main/java/Utilities/Configuration/MasterConfig.java

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Run SpotAwardPracticeEligibility
        run: mvn -q exec:java -Dexec.mainClass="Automation_Triggers.Practice_SpotAward.Trigger1.SpotAwardPracticeEligibility"
